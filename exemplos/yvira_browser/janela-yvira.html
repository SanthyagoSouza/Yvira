<!doctype html>

<html lang="pt-BR">

<head>

<meta charset="utf-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="referrer" content="strict-origin-when-cross-origin">

<title>Janela Yvira</title>

<style>

  :root{

    --bg-desktop:#07080d;

    --glass:rgba(22,24,36,.74);

    --glass-strong:rgba(30,33,48,.92);

    --stroke:rgba(255,255,255,.09);

    --stroke-strong:rgba(255,255,255,.17);

    --text:#e8eaf3;

    --muted:#8a90a8;

    --hover:rgba(255,255,255,.07);

    --field:rgba(0,0,0,.3);

    --pane:rgba(10,11,18,.55);

    --accent:#7c5cff;

    --accent-2:#22d3ee;

    --min:#fbbf24;--max:#34d399;--close:#ff4d6d;--ok:#34d399;--danger:#ff5c7a;

    --radius:16px;

    --ease:cubic-bezier(.22,1,.36,1);

    color-scheme:dark;

    font-family: Inter, "Segoe UI Variable", system-ui, -apple-system, sans-serif;

  }

  :root[data-theme=light]{

    --bg-desktop:#e8ebf5;

    --glass:rgba(255,255,255,.76);

    --glass-strong:rgba(255,255,255,.94);

    --stroke:rgba(15,20,50,.1);

    --stroke-strong:rgba(15,20,50,.2);

    --text:#151833;--muted:#5b6283;

    --hover:rgba(15,20,50,.06);

    --field:rgba(15,20,50,.06);

    --pane:rgba(255,255,255,.6);

    color-scheme:light;

  }

  *{box-sizing:border-box;margin:0}

  [hidden]{display:none!important}

  html,body{height:100%;width:100%;margin:0;padding:0;overflow:hidden;background:var(--bg-desktop);color:var(--text);display:flex;flex-direction:column;}

  button{font:inherit;color:inherit}



  /* ---------- Área de trabalho ---------- */

  #desktop{

    position:relative;width:100%;height:100%;overflow:hidden;background:var(--bg-desktop);display:flex;flex-direction:column;

  }



  /* ---------- Janela ---------- */

  .win{

    position:relative;display:flex;flex-direction:column;

    width:100%!important;height:100%!important;left:0!important;top:0!important;

    border-radius:0;border:none;

    background:var(--glass-strong);

    box-shadow:none;

  }

  .win.private{--accent:#9aa1b8;--accent-2:#6b7280;--glass:rgba(20,20,26,.84);--glass-strong:rgba(28,28,36,.95);--text:#e8eaf3;--muted:#9097ad;--stroke:rgba(255,255,255,.09);--stroke-strong:rgba(255,255,255,.17);--hover:rgba(255,255,255,.07);--field:rgba(0,0,0,.35);--pane:rgba(10,11,18,.6)}

  .win.dragging,.win.resizing{transition:none}

  .win.unfocused{filter:saturate(.7) brightness(.93)}

  .win.maximized{left:0!important;top:0!important;width:100%!important;height:100%!important;border-radius:0;border-color:transparent}

  .win.minimized{opacity:0;transform:translateY(40vh) scale(.25);pointer-events:none}

  .win.closing{opacity:0;transform:scale(.92);pointer-events:none}

  .win.no-anim,.win.no-anim *{transition:none!important;animation:none!important}

  @keyframes open{from{opacity:0;transform:scale(.94) translateY(14px)}to{opacity:1;transform:none}}



  .win::before{

    content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1px;pointer-events:none;

    background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 75%,transparent),transparent 35%,transparent 65%,color-mix(in srgb,var(--accent-2) 65%,transparent));

    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);

    -webkit-mask-composite:xor;mask-composite:exclude;opacity:.55;

  }

  .win.maximized::before{opacity:0}



  /* ---------- Barra de título ---------- */

  .titlebar{

    display:flex;align-items:center;gap:10px;height:46px;padding:0 8px 0 12px;

    background:var(--glass-strong);

    border-bottom:1px solid var(--stroke);

    user-select:none;-webkit-user-select:none;cursor:default;touch-action:none;

    flex-shrink:0;z-index:9000;

  }

  .win.maximized .titlebar{border-radius:0}

  .app-icon{
    width:24px;height:24px;border-radius:7px;flex:none;display:flex;align-items:center;justify-content:center;
    background:transparent;
    box-shadow:none;
  }
  .app-icon img{
    width:100%;height:100%;object-fit:contain;
  }

  .pill{flex:none;font-size:11.5px;padding:4px 10px;border-radius:99px;background:var(--hover);border:1px solid var(--stroke-strong);color:var(--muted)}



  .tabs{display:flex;align-items:flex-end;gap:4px;flex:1;min-width:0;height:100%;padding-top:9px;overflow:hidden}

  .tab{

    position:relative;display:flex;align-items:center;gap:8px;max-width:210px;min-width:44px;flex:0 1 210px;

    height:100%;padding:0 8px 0 10px;border-radius:10px 10px 0 0;font-size:12.5px;color:var(--muted);

    cursor:pointer;transition:background .2s,color .2s;white-space:nowrap;

  }

  .tab:hover{background:var(--hover);color:var(--text)}

  .tab.active{background:var(--glass-strong);color:var(--text);box-shadow:inset 0 1px 0 var(--stroke-strong)}

  .tab.active::after{content:"";position:absolute;left:12px;right:12px;top:0;height:2px;border-radius:0 0 3px 3px;background:linear-gradient(90deg,var(--accent),var(--accent-2))}

  .tfav{width:16px;height:16px;border-radius:5px;display:grid;place-items:center;font-size:10px;font-weight:700;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;flex:none}

  .tab .label{overflow:hidden;text-overflow:ellipsis;flex:1}

  .tab .x{width:18px;height:18px;border-radius:6px;display:grid;place-items:center;flex:none;opacity:.6;transition:.15s;font-size:11px}

  .tab .x:hover{background:var(--stroke-strong);opacity:1}

  .tab.tab-dragging{opacity:0.35;filter:grayscale(0.5)}
  .tab.drag-over-left{box-shadow:inset 3px 0 0 var(--accent)}
  .tab.drag-over-right{box-shadow:inset -3px 0 0 var(--accent)}
  .new-tab{width:28px;height:28px;border-radius:8px;border:0;background:none;color:var(--muted);cursor:pointer;display:grid;place-items:center;transition:.2s;flex:none;align-self:center;margin-top:6px}

  .new-tab:hover{background:var(--hover);color:var(--text);transform:rotate(90deg)}



  /* ---------- Botões da janela ---------- */

  .controls{display:flex;gap:2px;padding:3px;border-radius:12px;flex:none;background:var(--field);border:1px solid var(--stroke);box-shadow:inset 0 1px 2px rgba(0,0,0,.25)}

  .wbtn{

    --c:var(--muted);

    position:relative;width:38px;height:28px;border:0;border-radius:9px;background:transparent;

    color:var(--c);cursor:pointer;display:grid;place-items:center;overflow:hidden;

    transition:background .2s,color .2s,box-shadow .25s,transform .15s var(--ease);

  }

  .wbtn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform .3s var(--ease)}

  .wbtn:hover{transform:translateY(-1px)}

  .wbtn:active{transform:scale(.9)}

  .wbtn:focus-visible{outline:2px solid var(--accent-2);outline-offset:1px}

  .wbtn.min:hover{--c:#1a1203;background:linear-gradient(135deg,#fde68a,var(--min));box-shadow:0 0 16px -2px rgba(251,191,36,.8)}

  .wbtn.max:hover{--c:#03150e;background:linear-gradient(135deg,#a7f3d0,var(--max));box-shadow:0 0 16px -2px rgba(52,211,153,.8)}

  .wbtn.close:hover{--c:#fff;background:linear-gradient(135deg,#ff8fa3,var(--close));box-shadow:0 0 18px -2px rgba(255,77,109,.9)}

  .wbtn.min:hover svg{transform:translateY(2px)}

  .wbtn.max:hover svg{transform:scale(1.15)}

  .wbtn.close:hover svg{transform:rotate(90deg)}

  .wbtn .ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.55);transform:scale(0);animation:ripple .55s ease-out;pointer-events:none}

  @keyframes ripple{to{transform:scale(3.2);opacity:0}}

  .ic-restore{display:none}

  .win.maximized .ic-max{display:none}

  .win.maximized .ic-restore{display:block}



  /* ---------- Barra de navegação ---------- */

  .toolbar{display:flex;align-items:center;gap:6px;padding:8px 10px;background:var(--glass-strong);border-bottom:1px solid var(--stroke);position:relative;flex-shrink:0;z-index:8900;}

  .tbtn{position:relative;width:32px;height:32px;border-radius:9px;border:0;background:none;color:var(--muted);cursor:pointer;display:grid;place-items:center;transition:.2s;flex:none}

  .tbtn:hover{background:var(--hover);color:var(--text)}

  .tbtn[disabled]{opacity:.3;pointer-events:none}

  .tbtn[aria-expanded=true]{background:var(--hover);color:var(--text)}

  .tbtn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

  .tbtn.sm{width:26px;height:26px;border-radius:8px}

  .tbtn.sm svg{width:15px;height:15px}

  .tbtn.starred{color:var(--min)}

  .tbtn.starred svg{fill:currentColor}

  .tbadge{position:absolute;top:1px;right:0;min-width:15px;height:15px;padding:0 4px;border-radius:99px;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;font-size:9.5px;font-weight:700;display:grid;place-items:center}

  .address{

    flex:1;display:flex;align-items:center;gap:8px;height:34px;padding:0 6px 0 12px;border-radius:999px;min-width:0;

    background:var(--field);border:1px solid var(--stroke);font-size:13px;color:var(--text);transition:.25s;

  }

  .address:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 28%,transparent)}

  .address>svg{width:14px;height:14px;stroke:var(--ok);fill:none;stroke-width:2;flex:none}

  .address input{flex:1;background:none;border:0;outline:0;color:inherit;font:inherit;min-width:0}



  .bmbar{display:flex;gap:4px;padding:5px 10px;border-bottom:1px solid var(--stroke);background:var(--glass-strong);overflow:hidden;min-height:34px;flex-shrink:0;z-index:8800;}

  .bmbar button{display:flex;align-items:center;gap:7px;height:24px;padding:0 10px 0 6px;border:0;border-radius:8px;background:none;color:var(--muted);font-size:12.5px;cursor:pointer;white-space:nowrap;transition:.2s}

  .bmbar button:hover{background:var(--hover);color:var(--text)}

  .bmbar .none{font-size:12px;color:var(--muted);padding:3px 6px}

  .win:not(.has-bar) .bmbar{display:none}



  .progress{height:2px;background:transparent;overflow:hidden}

  .progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent-2))}

  .progress.loading i{animation:load 1.1s var(--ease) forwards}

  @keyframes load{0%{width:0;opacity:1}80%{width:92%}100%{width:100%;opacity:0}}



  /* ---------- Menu (3 pontinhos) e popover ---------- */

  .menu,.pop{

    position:absolute;z-index:9999;width:310px;max-height:calc(100% - 100px);overflow:auto;padding:6px;border-radius:16px;

    background:var(--glass-strong);border:1px solid var(--stroke-strong);

    -webkit-backdrop-filter:blur(30px) saturate(1.5);backdrop-filter:blur(30px) saturate(1.5);

    box-shadow:0 24px 60px -12px rgba(0,0,0,.6),0 0 0 1px rgba(0,0,0,.2);

    opacity:0;visibility:hidden;transform:translateY(-8px) scale(.96);transform-origin:top right;

    transition:opacity .18s,transform .25s var(--ease),visibility .18s;

  }

  .menu.show,.pop.show{opacity:1;visibility:visible;transform:none}

  .pop{width:320px;padding:18px}
  .pop.modal-center{
    top: 50% !important;
    left: 50% !important;
    right: auto !important;
    bottom: auto !important;
    transform: translate(-50%, -50%) !important;
    box-shadow: 0 20px 60px rgba(0,0,0,0.85), 0 0 0 1px var(--stroke-strong) !important;
    transition: opacity 0.15s ease, visibility 0.15s !important;
  }
  .pop.modal-center.show{
    transform: translate(-50%, -50%) !important;
  }

  .mi{display:flex;align-items:center;gap:12px;width:100%;height:36px;padding:0 10px;border:0;border-radius:10px;background:none;font-size:13.5px;text-align:left;cursor:pointer;color:var(--text);transition:background .15s}

  .mi:hover,.mi:focus-visible{background:var(--hover);outline:0}

  .mi span{flex:1}

  .mi kbd{font:inherit;font-size:11.5px;color:var(--muted)}

  .mi .chev{width:14px;height:14px;transition:transform .25s var(--ease);color:var(--muted)}

  .has-sub.open>.mi .chev{transform:rotate(90deg)}

  .mi.on{color:var(--accent-2)}

  .menu hr{border:0;border-top:1px solid var(--stroke);margin:5px 4px}

  .sub{display:none;margin:2px 0 4px 18px;padding-left:8px;border-left:1px solid var(--stroke)}

  .has-sub.open>.sub{display:block;animation:pg .25s var(--ease)}

  .sub .mi{height:32px;font-size:13px}

  .mzoom{display:flex;align-items:center;gap:10px;height:40px;padding:0 6px 0 10px;font-size:13.5px}

  .mzoom>span{flex:1}

  .zc{display:flex;align-items:center;border-radius:10px;background:var(--field);border:1px solid var(--stroke)}

  .zc button{width:30px;height:28px;border:0;background:none;cursor:pointer;border-radius:8px;font-size:16px}

  .zc button:hover{background:var(--hover)}

  .zc b{min-width:48px;text-align:center;font-size:12.5px;font-weight:600}

  .ibtn{width:30px;height:30px;border-radius:9px;border:0;background:none;cursor:pointer;display:grid;place-items:center;color:var(--muted)}

  .ibtn:hover{background:var(--hover);color:var(--text)}

  svg.i{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

  .pop h3{font-size:14px;margin-bottom:4px}

  .pop p{font-size:12.5px;color:var(--muted);line-height:1.5;margin-bottom:12px}

  .bignum{font-size:34px;font-weight:800;letter-spacing:-.03em;background:linear-gradient(135deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent}



  /* ---------- Área do aplicativo / páginas ---------- */

  .viewport{flex:1;min-height:0;position:relative;border-radius:0 0 var(--radius) var(--radius);overflow:hidden;background:var(--pane)}

  .win.maximized .viewport{border-radius:0}

  #view{position:absolute;inset:0;overflow:auto;scroll-behavior:smooth}

  #view.reader .page{max-width:680px;margin:0 auto;font:18px/1.85 Georgia,"Times New Roman",serif}

  #view iframe,#view canvas{position:absolute;inset:0;width:100%;height:100%;border:0}

  .page{min-height:100%;padding:28px clamp(16px,4vw,44px) 64px;animation:pg .4s var(--ease)}

  .page.still{animation:none}

  @keyframes pg{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  .page h1{font-size:22px;font-weight:700;letter-spacing:-.01em;margin-bottom:4px}

  .page h2{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:26px 0 10px}

  .lead{color:var(--muted);font-size:13px;margin-bottom:18px;line-height:1.5}

  .head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:16px}

  .tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

  mark{background:color-mix(in srgb,var(--min) 55%,transparent);color:inherit;border-radius:3px;padding:0 1px}

  mark.cur{background:var(--min);color:#1a1203}



  .btn{height:34px;padding:0 14px;border-radius:10px;border:1px solid var(--stroke-strong);background:var(--hover);color:var(--text);font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:.2s}

  .btn:hover{background:var(--stroke)}

  .btn.primary{border:0;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent-2));box-shadow:0 6px 20px -6px var(--accent)}

  .btn.primary:hover{filter:brightness(1.1)}

  .btn.danger{color:var(--danger)}

  .field{height:36px;padding:0 12px;border-radius:10px;background:var(--field);border:1px solid var(--stroke);color:var(--text);font:inherit;font-size:13px;outline:0;transition:.2s;min-width:0}

  .field:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}

  select.field{padding-right:8px}

  .card{padding:16px;border-radius:16px;background:var(--glass-strong);border:1px solid var(--stroke)}

  .row{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:12px;transition:.15s;cursor:pointer}

  .row:hover{background:var(--hover)}

  .row .grow{flex:1;min-width:0}

  .row b{display:block;font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .row small{display:block;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .row .time{font-size:12px;color:var(--muted);width:46px;flex:none}

  .row .acts{display:flex;gap:2px;opacity:0;transition:.15s}

  .row:hover .acts,.row:focus-within .acts{opacity:1}

  .rfav{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:13px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent-2));flex:none}

  .empty{display:grid;place-items:center;gap:8px;padding:56px 0;color:var(--muted);font-size:13px;text-align:center}

  .empty svg{width:34px;height:34px;opacity:.6}



  /* Nova aba */

  .newtab{max-width:840px;margin:0 auto;text-align:center;padding-top:3vh}

  .logo{font-size:58px;font-weight:800;letter-spacing:-.04em;background:linear-gradient(135deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:20px}

  .bigsearch{display:flex;align-items:center;gap:10px;height:50px;padding:0 20px;border-radius:99px;background:var(--glass-strong);border:1px solid var(--stroke-strong);max-width:600px;margin:0 auto 32px;transition:.25s;box-shadow:0 10px 30px -14px rgba(0,0,0,.5)}

  .bigsearch:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 25%,transparent)}

  .bigsearch input{flex:1;background:none;border:0;outline:0;color:inherit;font:inherit;font-size:15px}

  .tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:12px;justify-items:center}

  .tile{width:100%;display:grid;justify-items:center;gap:8px;padding:14px 6px;border:0;border-radius:16px;background:none;cursor:pointer;font-size:12px;color:var(--text);transition:.25s var(--ease)}

  .tile:hover{background:var(--hover);transform:translateY(-3px)}

  .tile .ico{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:19px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent-2));box-shadow:0 8px 20px -8px var(--accent)}

  .tile.add .ico{background:var(--hover);color:var(--muted);box-shadow:none;border:1px dashed var(--stroke-strong)}

  .tile span:last-child{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;text-align:left;margin-top:30px}

  .cards h3{font-size:13.5px;margin-bottom:12px;display:flex;align-items:center;gap:8px}

  .spark{display:flex;align-items:flex-end;gap:5px;height:46px;margin-top:12px}

  .spark i{flex:1;border-radius:4px;background:linear-gradient(180deg,var(--accent),var(--accent-2));opacity:.85}

  .priv-note{max-width:520px;margin:0 auto;text-align:left;line-height:1.6;font-size:13.5px;color:var(--muted)}

  .priv-note li{margin:6px 0 6px 18px}



  /* Downloads */

  .fileic{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;font-size:10px;font-weight:800;letter-spacing:.04em;color:var(--accent-2);background:color-mix(in srgb,var(--accent) 16%,transparent);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);flex:none}

  .bar{height:5px;border-radius:9px;background:var(--stroke-strong);overflow:hidden;margin-top:7px}

  .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .6s linear}



  /* Configurações */

  .setwrap{display:flex;gap:28px;flex-wrap:wrap;align-items:flex-start}

  .setnav{flex:0 0 210px;display:grid;gap:3px;position:sticky;top:0}

  .setnav button{display:flex;gap:10px;align-items:center;height:38px;padding:0 12px;border:0;border-radius:10px;background:none;color:var(--muted);cursor:pointer;font-size:13.5px;text-align:left;transition:.2s}

  .setnav button:hover{background:var(--hover);color:var(--text)}

  .setnav button.on{background:var(--glass-strong);color:var(--text);box-shadow:inset 0 0 0 1px var(--stroke-strong)}

  .setbody{flex:1 1 340px;min-width:0;max-width:680px}

  .srow{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:14px 0;border-bottom:1px solid var(--stroke)}

  .srow b{font-size:13.5px;font-weight:600}

  .srow small{display:block;color:var(--muted);font-size:12px;margin-top:3px;line-height:1.4}

  .switch{width:40px;height:23px;border-radius:99px;border:0;background:var(--stroke-strong);position:relative;cursor:pointer;flex:none;transition:.25s}

  .switch::after{content:"";position:absolute;top:3px;left:3px;width:17px;height:17px;border-radius:50%;background:#fff;transition:.25s var(--ease);box-shadow:0 2px 6px rgba(0,0,0,.3)}

  .switch[aria-checked=true]{background:linear-gradient(135deg,var(--accent),var(--accent-2))}

  .switch[aria-checked=true]::after{transform:translateX(17px)}

<script>

(() => {

  const $ = (s, r = document) => r.querySelector(s);

  const $$ = (s, r = document) => [...r.querySelectorAll(s)];

  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));



  const win = $('#win'), bar = $('#titlebar'), desktop = $('#desktop'), root = document.documentElement;

  const view = $('#view'), tabsEl = $('#tabs'), urlIn = $('#url'), menu = $('#menu'), pop = $('#pop');

  const dockMin = $('#dockMin'), dockOpen = $('#dockOpen');



  /* ================= Ponte com o motor Yvira =================

     Todos os eventos saem como CustomEvent 'yvira:window' no window: e.detail = { action, ... }

     Ações: minimize, restore, maximize, unmaximize, close, open, navigate, search, devtools, reveal

     Para montar o app dentro da aba, escute 'yvira:mount' (e.detail.slot = elemento, e.detail.url). */

  const bridge = (action, extra = {}) => {

    window.dispatchEvent(new CustomEvent('yvira:window', { detail: { action, ...extra } }));

    try {

      if (window.yvira && typeof window.yvira.emit === 'function') {

        window.yvira.emit(action, extra);

      }

    } catch (e) {

      console.warn('bridge yvira error:', e);

    }

  };



  /* ================= Dados (localStorage quando disponível) ================= */

  const store = {

    get(k, d){ try{ const v = localStorage.getItem('yv_' + k); return v ? JSON.parse(v) : d; }catch{ return d; } },

    set(k, v){ try{ localStorage.setItem('yv_' + k, JSON.stringify(v)); }catch{} }

  };

  const NOW = Date.now(), H = 36e5, D = 864e5;

  let uid = NOW;

  const nid = () => ++uid;

  const S = {

    bm:   store.get('bm',   [{t:'Meu aplicativo',u:'yvira://app/inicio'},{t:'GitHub',u:'https://github.com'},{t:'MDN Web Docs',u:'https://developer.mozilla.org'},{t:'Stack Overflow',u:'https://stackoverflow.com'},{t:'Wikipédia',u:'https://www.wikipedia.org'}]),

    hist: store.get('hist', [

      {id:1,t:NOW-12*60e3,title:'MDN Web Docs',url:'https://developer.mozilla.org'},

      {id:2,t:NOW-2*H,title:'github.com',url:'https://github.com'},

      {id:3,t:NOW-26*H,title:'stackoverflow.com',url:'https://stackoverflow.com'},

      {id:4,t:NOW-29*H,title:'wikipedia.org',url:'https://www.wikipedia.org'},

      {id:5,t:NOW-4*D,title:'Meu aplicativo',url:'yvira://app/inicio'}]),

    dl:   store.get('dl', [

      {id:11,name:'relatorio-de-testes.pdf',src:'github.com',size:2516582,p:1},

      {id:12,name:'casos-de-teste.xlsx',src:'yvira://app/inicio',size:151552,p:1},

      {id:13,name:'instalador-yvira.zip',src:'github.com',size:50331648,p:.42}]),

    set:  Object.assign({theme:'dark',accent:'violet',engine:'Yvira',startup:'app',blockTrackers:true,blockCookies:true,dnt:true,noHistory:false,bmBar:true,anim:true,zoom:100}, store.get('set', {})),

    blk:  store.get('blk', 128),
    perms: store.get('perms', {})

  };

  const save = k => store.set(k, S[k]);



  const ACCENTS = {violet:['#7c5cff','#22d3ee','Violeta'],ocean:['#3b82f6','#06b6d4','Oceano'],sunset:['#ff6b6b','#fbbf24','Pôr do sol'],forest:['#10b981','#a3e635','Floresta'],rose:['#ec4899','#8b5cf6','Rosa']};

  const ENGINES = {Yvira:'https://yvira.search/?q=',Google:'https://www.google.com/search?q=',DuckDuckGo:'https://duckduckgo.com/?q=',Bing:'https://www.bing.com/search?q='};



  /* ================= Ícones ================= */

  const P = {

    plus:'M12 5v14M5 12h14', ghost:'M4 12a8 8 0 0 1 16 0v8l-3-2-2.5 2L12 18l-2.5 2L7 18l-3 2zM9 11h.01M15 11h.01',

    history:'M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5M12 7v5l3 2', download:'M12 4v11M7 11l5 5 5-5M5 20h14',

    star:'M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.9L12 17l-5.2 2.7 1-5.9L3.5 9.7l5.9-.8z',

    full:'M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5', print:'M7 9V4h10v5M7 17H5a1 1 0 0 1-1-1v-5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v5a1 1 0 0 1-1 1h-2M7 14h10v6H7z',

    search:'M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14zM21 21l-4.5-4.5', share:'M12 4v11M8 8l4-4 4 4M5 13v6h14v-6',

    tools:'M14.7 6.3a4 4 0 0 0-5.4 5.4L4 17l3 3 5.3-5.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.2-.5-.5-2.2z',

    sliders:'M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0M14 4v4M8 10v4M16 16v4',

    info:'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM12 11v6M12 7.5h.01', x:'M6 6l12 12M18 6L6 18',

    book:'M4 5h6a2 2 0 0 1 2 2v12a2 2 0 0 0-2-2H4zM20 5h-6a2 2 0 0 0-2 2v12a2 2 0 0 1 2-2h6z',

    shield:'M12 3l7 3v5c0 5-3 8-7 10-4-2-7-5-7-10V6z', trash:'M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13M10 11v6M14 11v6',

    globe:'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18',

    folder:'M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z', file:'M7 3h7l5 5v13H7zM14 3v5h5',

    chev:'M9 6l6 6-6 6', code:'M8 8l-5 4 5 4M16 8l5 4-5 4M14 5l-4 14', palette:'M12 3a9 9 0 1 0 0 18c1.5 0 2-1 1.5-2.2-.6-1.4.2-2.8 1.8-2.8H17a4 4 0 0 0 4-4c0-5-4-9-9-9zM8 11h.01M12 8h.01M16 11h.01',

    power:'M12 3v8M6.5 6.5a8 8 0 1 0 11 0', external:'M14 4h6v6M20 4l-9 9M18 14v5H5V6h5', check:'M5 12l5 5 9-10'

  };

  const ic = (n, c = '') => `<svg class="i ${c}" viewBox="0 0 24 24"><path d="${P[n]}"/></svg>`;



  /* ================= Utilitários ================= */

  const hostOf = u => { try{ return new URL(u).hostname.replace(/^www\./,''); }catch{ return u; } };

  const fmtSize = b => b < 1024 ? b + ' B' : b < 1048576 ? (b/1024).toFixed(0) + ' KB' : (b/1048576).toFixed(1) + ' MB';

  const fmtTime = t => new Date(t).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});

  const favOf = (u, t) => /^yvira:/.test(u) ? 'Y' : (hostOf(u)[0] || t[0] || '?').toUpperCase();

  const dayLabel = t => {

    const d = new Date(t), n = new Date();

    if (d.toDateString() === n.toDateString()) return 'Hoje';

    const y = new Date(n - D); if (d.toDateString() === y.toDateString()) return 'Ontem';

    return d.toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'});

  };

  function toast(msg){

    const el = document.createElement('div'); el.className = 'toast'; el.textContent = msg;

    $('#toasts').appendChild(el); setTimeout(() => { el.style.transition='.3s'; el.style.opacity='0'; setTimeout(()=>el.remove(),300); }, 2400);

  }

  function armed(el){

    if (el.dataset.armed){ delete el.dataset.armed; return true; }

    el.dataset.armed = 1; el._h = el.innerHTML; el.textContent = 'Clique para confirmar';

    setTimeout(() => { if (el.isConnected && el.dataset.armed){ delete el.dataset.armed; el.innerHTML = el._h; } }, 3000);

    return false;

  }



  /* ================= Rotas ================= */

  function parse(url){

    const [rest, hash = ''] = url.split('#'); const [path, qs = ''] = rest.split('?');

    return { path: path.toLowerCase(), qs: new URLSearchParams(qs), hash };

  }

  function normalize(raw){
    let v = raw.trim(); if (!v) return 'yvira://newtab';
    const alias = {historico:'historico',downloads:'downloads',favoritos:'favoritos',configuracoes:'configuracoes',sobre:'sobre'};
    if (alias[v.toLowerCase()]) return 'yvira://' + alias[v.toLowerCase()];

    // Trata URLs diretas sem protocolo (ex: youtube.com ou google.com)
    if (!/\s/.test(v) && /^[\w-]+(\.[\w-]+)+(\/.*)?$/i.test(v) && !/^https?:\/\//i.test(v) && !/^yvira:\/\//i.test(v)) {
      v = 'https://' + v;
    }

    if (/^yvira:\/\//i.test(v) || /^https?:\/\//i.test(v)) return v;
    return 'https://duckduckgo.com/?q=' + encodeURIComponent(v);
  }
  const INTERNAL = {

    'yvira://newtab':        {t:'Nova aba',f:'+',r:pNew},

    'yvira://historico':     {t:'Histórico',f:'↺',r:pHist},

    'yvira://downloads':     {t:'Downloads',f:'↓',r:pDl},

    'yvira://favoritos':     {t:'Favoritos',f:'★',r:pBm},

    'yvira://configuracoes': {t:'Configurações',f:'⚙',r:pSet},

    'yvira://sobre':         {t:'Sobre o Yvira',f:'i',r:pAbout}

  };

  function meta(url){

    const p = parse(url);

    if (INTERNAL[p.path]) return { kind:'int', ...INTERNAL[p.path], p };

    if (p.path.startsWith('yvira://app')) return { kind:'app', t:'Meu aplicativo', f:'Y', r:pApp, p };

    if (p.path === 'yvira://busca'){ const q = p.qs.get('q') || ''; return { kind:'search', t:'Pesquisa: ' + q, f:'⌕', r:pSearch, p, q }; }

    const h = hostOf(url); return { kind:'web', t:h, f:h[0].toUpperCase(), r:pWeb, p };

  }



  /* ================= Abas ================= */

  let tabs = [], activeId = 0, tid = 0;

  const cur = () => tabs.find(t => t.id === activeId);

  const mkTab = (url, priv = false) => ({ id: ++tid, url, title:'', fav:'', stack:[url], i:0, priv, blocked:0 });



  function renderTabs(){

    tabsEl.innerHTML = tabs.map(t => `<div class="tab ${t.id===activeId?'active':''}" data-id="${t.id}" draggable="true" title="${esc(t.title)}"><span class="tfav">${esc(t.priv?'◐':t.fav)}</span><span class="label">${esc(t.title)}</span><span class="x" data-a="tab-close" title="Fechar aba">✕</span></div>`).join('');

  }

  function openTab(url, o = {}){

    const t = mkTab(url, !!o.priv); tabs.push(t); activeId = t.id; load(t); return t;

  }

  function activate(id){
    if (activeId === id) return;
    activeId = id;
    renderTabs();
    const t = cur();
    show(t);
    bridge('tab_switched', { tab: t.id, id: t.id, url: t.url, private: t.priv });
  }

  function closeTab(id){
    const idx = tabs.findIndex(t => t.id === id);
    if (idx < 0) return;

    bridge('tab_closed', { tab: id, id: id });

    if (tabs.length === 1){
      const t = tabs[0];
      t.priv = false;
      t.stack = ['yvira://newtab'];
      t.i = 0;
      t.url = t.stack[0];
      load(t);
      return;
    }

    tabs.splice(idx, 1);
    if (id === activeId) {
      activeId = (tabs[idx] || tabs[idx-1]).id;
    }
    renderTabs();
    const t = cur();
    show(t);
    bridge('tab_switched', { tab: t.id, id: t.id, url: t.url, private: t.priv });
  }

  function openInternal(url){

    const t = cur();

    if (t.url === 'yvira://newtab' && !t.priv) return go(url);

    const same = tabs.find(x => parse(x.url).path === parse(url).path && x.priv === t.priv);

    if (same){ same.url = url; same.stack[same.i] = url; activeId = same.id; load(same,{record:false}); return; }

    openTab(url, { priv: t.priv });

  }



  /* ================= Navegação ================= */

  function go(raw){

    const t = cur(), url = normalize(raw);

    t.stack = t.stack.slice(0, t.i + 1); t.stack.push(url); t.i++; t.url = url; load(t);

  }

  function nav(d){

    const t = cur(), i = t.i + d; if (i < 0 || i >= t.stack.length) return;

    t.i = i; t.url = t.stack[i]; load(t, { record:false });

  }

  function load(t, o = {}){

    const m = meta(t.url); t.title = m.t; t.fav = m.f;

    t.blocked = (m.kind === 'web' && S.set.blockTrackers) ? 2 + Math.floor(Math.random() * 8) : 0;

    if (['web','app','search'].includes(m.kind) && o.record !== false){

      if (!t.priv && !S.set.noHistory){

        S.hist.unshift({ id:nid(), t:Date.now(), title:m.t, url:t.url }); S.hist.length = Math.min(S.hist.length, 300); save('hist');

      }

      if (t.blocked){ S.blk += t.blocked; save('blk'); }

    }

    renderTabs();

    if (t.id === activeId){ show(t, o.anim !== false); flash(); }

    bridge('navigate', { url: t.url, tab: t.id, private: t.priv });

    if (m.kind === 'search') bridge('search', { engine:S.set.engine, query:m.q, url:ENGINES[S.set.engine] + encodeURIComponent(m.q) });

  function histListHTML(q = ''){

      out += `<div class="row" data-a="nav" data-url="${esc(h.url)}"><span class="time">${fmtTime(h.t)}</span><span class="rfav">${esc(favOf(h.url,h.title))}</span><div class="grow"><b>${esc(h.title)}</b><small>${esc(h.url)}</small></div><div class="acts"><button class="ibtn" data-a="hist-del" data-id="${h.id}" title="Remover do histórico">${ic('x')}</button></div></div>`;

      <div class="srow"><div><b>Pesquisar com</b><small>O motor Yvira recebe o evento <span class="kbd">search</span> com a URL pronta.</small></div><select class="field" data-k="engine">${Object.keys(ENGINES).map(e => `<option ${S.set.engine===e?'selected':''}>${e}</option>`).join('')}</select></div>`;

    return `<div class="setwrap"><nav class="setnav">${secs.map(([k,l,i]) => `<button class="${curSec===k?'on':''}" data-a="set-sec" data-s="${k}">${ic(i)}${l}</button>`).join('')}</nav><section class="setbody">${body}</section></div>`;

    if (!host) return 'prompt';

    if (!host) return;
    if (!S.perms[host]) S.perms[host] = {};

    save('perms');
    bridge('set_site_permission', { host, kind, state });

  function popSiteInfoHTML(){
    const t = cur();
    const h = hostOf(t.url) || 'yvira.local';
    const isInternal = !t.url || t.url.startsWith('yvira://');
    if (isInternal) {
      return `<h3>Janela interna Yvira</h3><p style="margin:8px 0 0;font-size:12.5px;color:var(--muted)">Esta e uma pagina de controle local e segura do motor Yvira.</p>`;
    }
    const isSecure = t.url.startsWith('https://');
    const permRow = (kind, label, icon) => {
      const curVal = sitePerm(h, kind);
      return `<div style="display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--stroke)">
        <div style="font-size:13px;display:flex;align-items:center;gap:8px">${label}</div>
        <select class="field" style="height:28px;padding:0 8px;font-size:12px" data-a="change-perm" data-host="${esc(h)}" data-kind="${kind}">

          <option value="prompt" ${curVal==='prompt'?'selected':''}>Perguntar</option>
        </select>

        bridge('set_site_permission', { host: h, kind: k, state: s });
      });
    });
  }
  const first = mkTab('yvira://newtab');
  tabs = [first]; activeId = first.id; load(first, { record:false });
})();

</script>
